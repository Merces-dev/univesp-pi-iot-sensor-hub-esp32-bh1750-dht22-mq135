services:
  # ─── Broker MQTT ────────────────────────────────────────────────────────────
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT padrão
      - "9001:9001" # WebSocket (para debug)
    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log

  # ─── Banco de dados (PostgreSQL) ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sensorhub
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sensorhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Backend (NestJS) ───────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sensorhub
    depends_on:
      mqtt-broker:
        condition: service_started
      postgres:
        condition: service_healthy

  # ─── Frontend (Vite + React) ────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  # ─── Mock ESP32 (simulador de telemetria) ───────────────────────────────────
  mock-device:
    build: ./mock
    container_name: mock-device
    restart: unless-stopped
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - INTERVAL_MS=2000
    depends_on:
      - mqtt-broker

volumes:
  mqtt_data:
  mqtt_logs:
  pg_data:
